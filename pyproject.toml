[project]
name = "open-bps"
version = "0.2.0"
description = "Open, auditable building performance standard (BPS) screening and retrofit underwriting: DC BEPS, Energize Denver, NYC Local Law 97 and Boston BERDO, from public data or your own portfolio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sneh Patel" }]
keywords = ["building performance standards", "BEPS", "Energize Denver", "Local Law 97", "BERDO", "decarbonization", "energy benchmarking", "real estate", "C-PACE", "179D"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pydantic>=2",
]

[project.optional-dependencies]
app = ["streamlit>=1.45"]
dev = ["pytest>=8", "ruff>=0.5", "formulas>=1.2"]
mcp = ["fastmcp>=2"]

[project.scripts]
open-bps = "open_bps.cli:main"
open-bps-mcp = "open_bps.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Skippy-8/open-bps"
Issues = "https://github.com/Skippy-8/open-bps/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_bps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::SyntaxWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["open_bps"]
