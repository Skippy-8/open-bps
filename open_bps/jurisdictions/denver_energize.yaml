# Denver: Energize Denver Building Performance Policy, buildings 25,000 sq ft and larger.
# Every rule cites its primary source. Per-building targets come from Denver's Master Dataset, not from this file.
jurisdiction: Denver, CO
program: Energize Denver (performance requirements, buildings >= 25,000 sq ft)
rule_version: denver_tg_25k_v3_2025-04
effective_from: 2025-04-01
checked_on: 2026-10-20

sources:
  tg_v3:
    title: Energize Denver Technical Guidance, Buildings 25,000 sq ft or larger, v3 (April 2025)
    url: https://www.denvergov.org/files/assets/public/v/1/climate-action/documents/buildings-and-homes/energize-denver/rules-and-tg/ed-technical-guidance-buildings-25k-sf-v3-april-2025-clean.pdf
  master_dataset_2025:
    title: Energize Denver 2025 Master Dataset (Denver open data hub)
    url: https://www.arcgis.com/sharing/rest/content/items/169272beebc54212ac08f3f607bef272/data

metric: >-
  Weather-normalized site EUI for the performance year, less any renewable credit, transportation energy
  and electrification incentive (tg_v3 glossary "EUI" and section 9.4). Public data has the weather-normalized
  site EUI but not the credits, so a public-data estimate is an upper bound on the building's EUI.

performance_evaluation:                        # source: tg_v3 section 9.4 and 10.2.1.2.1
  kbtu_not_achieved: "max(0, (eui - target_eui) * gross_floor_area)"
  penalty: "kbtu_not_achieved * rate_per_kbtu"
  worked_example: "10 kBtu/sf over target x 100,000 sf = 1,000,000 kBtu; x $0.35 = $350,000 (one-period rate)"

schedules:                                     # source: tg_v3 sections 1.3, 4 (timeline extension)
  original:
    target_years: {first_interim: 2025, second_interim: 2027, final: 2030}   # "2024/2025/2026" interim, by building
    rate_per_kbtu: 0.15                        # three performance measurement periods (Table 17)
  extended:
    note: >-
      Opt-in when submitting the 2025 benchmarking report: the 2024/2025/2026 interim target moves to 2028,
      the 2027 interim target is eliminated, and the final target moves from 2030 to 2032.
    target_years: {first_interim: 2028, final: 2032}
    rate_per_kbtu: 0.23                        # two performance measurement periods (Table 17)
  open_question: >-
    The public dataset does not say which buildings opted into the extension; show both schedules until
    Denver publishes it or a building's owner supplies it.

rates_per_kbtu:                                # source: tg_v3 Table 17 (rates halved in early 2025)
  three_periods: 0.15
  two_periods: 0.23
  one_period: 0.35                             # timeline extension or other reason
  late_extension_addition: 0.10
  new_covered_building: 0.15
  maintenance_within_5pct: 0.05                # final target met earlier, now within 5% of it
  maintenance_over_5pct: 0.15
no_report_penalty_per_sq_ft: 5.00              # assessor's square footage; Table 17
enforcement_start: "No penalties will be levied until late 2029 based on compliance"   # tg_v3 section 1.3.4

# ---- Policy registry header (open_bps.policy.JurisdictionPolicy). rules.load("denver") returns this file without
# ---- these keys, exactly as in 0.1.0.
id: denver_energize
metrics: [weather_normalized_site_eui]
threshold_basis: building_data               # interim and final targets per building are in the Master Dataset
compliance_periods:
  - {id: interim, start_year: 2025, end_year: 2029, source: tg_v3, note: "original 2025/2027 or extended 2028 interim targets"}
  - {id: final, start_year: 2030, source: tg_v3, note: "final target 2030 (original) or 2032 (extended)"}
penalty:
  kind: per_unit_over_limit
  unit: kBtu
  rates_by_schedule: {original: 0.15, extended: 0.23}
  source: tg_v3
  section: Table 17
