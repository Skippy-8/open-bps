# New York City: Local Law 97 of 2019 (NYC Admin Code Article 320) and 1 RCNY §103-14.
# Every number cites its primary source. Limits by ESPM property type come from 1 RCNY §103-14(c)(3); they were
# parsed from the rule PDF (60 types for each period) and spot-checked by hand in tests/test_policy.py.
id: nyc_ll97
jurisdiction: New York City, NY
program: Local Law 97 (Article 320 building emissions limits)
rule_version: nyc_ll97_rcny_103-14_2024
effective_from: 2024-01-01
checked_on: 2026-10-22

sources:
  rcny_103_14:
    title: 1 RCNY §103-14, Department of Buildings rule on building emissions limits (as promulgated)
    url: https://www.nyc.gov/assets/buildings/rules/1_RCNY_103-14.pdf
    checked_on: 2026-10-22
  dob_emissions_2024:
    title: "DOB, Local Law 97: calculating building emissions (June 26, 2024); quotes Admin Code §28-320.3.1.1"
    url: https://www.nyc.gov/assets/buildings/pdf/ll97_emissions.pdf
    note: >-
      The Admin Code text on amlegal.com is behind a Cloudflare check; DOB's own presentation quoting §28-320.3.1.1 is
      cited instead. Its 2035+ electricity and steam coefficients are DOB projections, not law.
    checked_on: 2026-10-22
  dob_article_320_guide:
    title: DOB Article 320 Info Guide, rev. 06/30/2025
    url: https://www.nyc.gov/assets/buildings/pdf/article_320_guide.pdf
    section: "IV(A) ESPM categories (pp.73-75); worked example pp.122-123; §28-320.6 penalty"
    checked_on: 2026-10-22
  ll84_disclosure:
    title: NYC Building Energy and Water Data Disclosure for Local Law 84, 2023 to present (NYC Open Data 5zyy-y8am)
    url: https://data.cityofnewyork.us/Environment/NYC-Building-Energy-and-Water-Data-Disclosure-for-/5zyy-y8am
    checked_on: 2026-10-22

metrics: [ghg_intensity]
threshold_basis: property_type_table
compliance_periods:
  - {id: "2024-2029", start_year: 2024, end_year: 2029, source: rcny_103_14}
  - {id: "2030-2034", start_year: 2030, end_year: 2034, source: rcny_103_14}
  - {id: "2035-2039", start_year: 2035, end_year: 2039, source: rcny_103_14}
  - {id: "2040-2049", start_year: 2040, end_year: 2049, source: rcny_103_14}
  - {id: "2050+", start_year: 2050, source: rcny_103_14}

