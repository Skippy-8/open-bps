emission_factors:                  # tCO2e per kWh (electricity) or per kBtu
  electricity:
    unit: tCO2e/kWh
    source: dob_emissions_2024
    section: "Admin Code §28-320.3.1.1 (2024-2029); 1 RCNY §103-14(d)(3)(ii)(a) (2030-2034); DOB table (2035+)"
    values: {"2024-2029": 0.000288962, "2030-2034": 0.000145, "2035-2039": 0.0000866886, "2040+": 0.0}
    estimated: ["2035-2039", "2040+"]
  natural_gas:
    unit: tCO2e/kBtu
    source: rcny_103_14
    section: "Admin Code §28-320.3.1.1; §103-14(d)(3)(ii)(b); DOB table (2035+)"
    values: {"2024-2034": 0.00005311, "2035+": 0.00005311}
    estimated: ["2035+"]
  district_steam:
    unit: tCO2e/kBtu
    source: dob_emissions_2024
    section: "Admin Code §28-320.3.1.1 (2024-2029); §103-14(d)(3)(ii)(c) (2030-2034); DOB table (2035+)"
    values: {"2024-2029": 0.00004493, "2030-2034": 0.0000432, "2035-2039": 0.0000320, "2040+": 0.0000250}
    estimated: ["2035-2039", "2040+"]
  fuel_oil_2:
    unit: tCO2e/kBtu
    source: rcny_103_14
    section: "Admin Code §28-320.3.1.1; §103-14(d)(3)(i)(b)(1); DOB table (2035+)"
    values: {"2024-2034": 0.00007421, "2035+": 0.00007421}
    estimated: ["2035+"]
  fuel_oil_4:
    unit: tCO2e/kBtu
    source: rcny_103_14
    section: "Admin Code §28-320.3.1.1; §103-14(d)(3)(i)(b)(2); DOB table (2035+)"
    values: {"2024-2034": 0.00007529, "2035+": 0.00007529}
    estimated: ["2035+"]
  fuel_oil_1:
    unit: tCO2e/kBtu
    source: rcny_103_14
    section: "§103-14(d)(3)(i)(a), Distillate Fuel Oil No. 1"
    values: {"2024-2034": 0.00007350}
  diesel:
    unit: tCO2e/kBtu
    source: rcny_103_14
    section: "§103-14(d)(3)(i)(a)"
    values: {"2024-2034": 0.00007421}
  propane:
    unit: tCO2e/kBtu
    source: rcny_103_14
    section: "§103-14(d)(3)(i)(a)"
    values: {"2024-2034": 0.00006425}
  kerosene:
    unit: tCO2e/kBtu
    source: rcny_103_14
    section: "§103-14(d)(3)(i)(a)"
    values: {"2024-2034": 0.00007769}
  # Fuel oil #5/#6 has no coefficient in the rule: §103-14(d)(3)(i)(c) has the owner propose one. A building that
  # burns it is flagged, not estimated.

blending:
  method: gfa_weighted             # B = Σ l_k × s_k over every property type in the building
  source: rcny_103_14
  section: "§103-14(d), Equation 103-14.1"

penalty:
  kind: per_unit_over_limit
  unit: tCO2e
  rate: 268
  source: dob_article_320_guide
  section: "Admin Code §28-320.6: (emissions - limit) × $268 per tCO2e, per year"

unassignable_types:
  "Other": "1 RCNY §103-14(c)(2): may not be assigned to any portion of a covered building"
  "Mixed Use Property": "1 RCNY §103-14(c)(2): may not be assigned to any portion of a covered building"
  "Energy/Power Station": "Article 320 guide p.75: utilities are not covered under LL97"
  "Other - Utility": "Article 320 guide p.75: utilities are not covered under LL97"
  "Wastewater Treatment Plant": "Article 320 guide p.73: left off the table, unlikely to be a covered building"
  "Drinking Water Treatment & Distribution": "Article 320 guide p.75: utilities are not covered under LL97"
  "Zoo": "Article 320 guide p.73: left off the table, unlikely to be a covered building"
  "Single-Family Home": "Article 320 guide p.73: left off the table, unlikely to be a covered building"

notes:
  - "CY2024-2025: an owner may elect the §28-320.3.1 occupancy-group limit if it is higher (§103-14(c)(3)(ii)). The occupancy group is not in public data, so open-bps uses the ESPM-type limit; for some buildings the true 2024-2025 limit is higher."
  - "Deductions are not modelled: RECs, offsets (capped at 10% of the limit), beneficial electrification, solar and storage. They lower reported emissions."
  - "2035+ electricity and steam coefficients are DOB projections, not law, and are flagged Estimated on every output."
  - "'basis: suggested' maps follow the DOB guide's Suggested Property Type, which a registered design professional may replace with another equivalent type."

