# Boston: Building Emissions Reduction and Disclosure Ordinance (BERDO 2.0), City of Boston Code §7-2.2, with the
# 2026 BERDO Regulations and the Policies and Procedures (v5, adopted 2026-09-14). Every number cites its source.
id: boston_berdo
jurisdiction: Boston, MA
program: BERDO 2.0 (building emissions standards)
rule_version: boston_berdo_2.0_pp_v5_2026-09
effective_from: 2025-01-01
checked_on: 2026-10-22

sources:
  ordinance:
    title: City of Boston Code §7-2.2, BERDO 2.0 (Docket 0775, as amended)
    url: https://www.boston.gov/sites/default/files/file/2023/12/BERDO%202.0%20Final%20Amended%20Docket%200775_1.pdf
    section: "§7-2.2(i) Table 1; compliance mechanisms (d) ACP; enforcement (ii) fines"
    checked_on: 2026-10-22
  regulations:
    title: BERDO Regulations (2026)
    url: https://www.boston.gov/sites/default/files/file/2026/05/2026%20Draft%20Regulations%20Final_2.pdf
    section: "§VIII Emissions Factors; §IX Emissions Standards"
    note: the boston.gov link labelled 'Clean Versions of Adopted Regulations' serves a byte-identical file
    checked_on: 2026-10-22
  policies_procedures:
    title: BERDO Policies and Procedures, version 5 (adopted 2026-09-14)
    url: https://www.boston.gov/sites/default/files/file/2026/09/BERDO%20Policies%20and%20Procedures_0.pdf
    section: "§5 emissions; §6 blended standard; Appendix A building uses; Appendix B projected grid factors"
    checked_on: 2026-10-22
  factor_list:
    title: BERDO Emissions Factors List (factors for calculating emissions from 2023; updated June 2024)
    url: https://www.boston.gov/sites/default/files/file/2024/06/BERDO%20Emissions%20Factors%20List_1.pdf
    archived: http://web.archive.org/web/20240718082749/https://www.boston.gov/sites/default/files/file/2024/06/BERDO%20Emissions%20Factors%20List_1.pdf
    note: >-
      Removed from boston.gov (404). These are the fuel factors the city applied in its 2026 disclosure of 2025 data
      (natural gas 53.11 on 99.9% of rows; #2 oil 74.21 on 100%).
    checked_on: 2026-10-22
  flexibility_guide:
    title: BERDO Flexibility Measures guide
    url: https://www.boston.gov/sites/default/files/berdo/BERDO_FlexibilityMeasures.pdf
    section: "Blended Emissions Standard: 'As a default, buildings are required to comply with the emissions standard that matches its largest primary use type'"
    checked_on: 2026-10-22
  mgl_rps:
    title: M.G.L. c.25A §11F(a), Massachusetts RPS Class I schedule
    url: https://malegislature.gov/Laws/GeneralLaws/PartI/TitleII/Chapter25A/Section11F
    section: "+2 points a year through 2024, +3 through 2029, +1 a year thereafter"
    checked_on: 2026-10-22
  re_guidance:
    title: BERDO Renewable Energy and Emissions Compliance Guidance (April 2024)
    url: https://www.boston.gov/sites/default/files/file/2024/04/BERDO%20Renewable%20Energy%20and%20Emissions%20Compliance%20Guidance.pdf
    section: "FAQ 1: 2024 RPS Class I requirement is 24%"
    checked_on: 2026-10-22
  disclosure_2026:
    title: BERDO 2026 disclosure (2025 data), data.boston.gov, ODC-PDDL
    url: https://data.boston.gov/dataset/building-emissions-reduction-and-disclosure-ordinance
    checked_on: 2026-10-22

metrics: [ghg_intensity]
threshold_basis: property_type_table
compliance_periods:
  - {id: "2025-2029", start_year: 2025, end_year: 2029, source: ordinance}
  - {id: "2030-2034", start_year: 2030, end_year: 2034, source: ordinance}
  - {id: "2035-2039", start_year: 2035, end_year: 2039, source: ordinance}
  - {id: "2040-2044", start_year: 2040, end_year: 2044, source: ordinance}
  - {id: "2045-2049", start_year: 2045, end_year: 2049, source: ordinance}
  - {id: "2050+", start_year: 2050, source: ordinance}

