  source: ordinance
  section: "§7-2.2(i), Table 1: CO2e Emissions Standards by Building Use"
  by_class:
    "Assembly": {"2025-2029": 7.8, "2030-2034": 4.6, "2035-2039": 3.3, "2040-2044": 2.1, "2045-2049": 1.1, "2050+": 0}
    "College/University": {"2025-2029": 10.2, "2030-2034": 5.3, "2035-2039": 3.8, "2040-2044": 2.5, "2045-2049": 1.2, "2050+": 0}
    "Education": {"2025-2029": 3.9, "2030-2034": 2.4, "2035-2039": 1.8, "2040-2044": 1.2, "2045-2049": 0.6, "2050+": 0}
    "Food Sales & Service": {"2025-2029": 17.4, "2030-2034": 10.9, "2035-2039": 8.0, "2040-2044": 5.4, "2045-2049": 2.7, "2050+": 0}
    "Healthcare": {"2025-2029": 15.4, "2030-2034": 10.0, "2035-2039": 7.4, "2040-2044": 4.9, "2045-2049": 2.4, "2050+": 0}
    "Lodging": {"2025-2029": 5.8, "2030-2034": 3.7, "2035-2039": 2.7, "2040-2044": 1.8, "2045-2049": 0.9, "2050+": 0}
    "Manufacturing/Industrial": {"2025-2029": 23.9, "2030-2034": 15.3, "2035-2039": 10.9, "2040-2044": 6.7, "2045-2049": 3.2, "2050+": 0}
    "Multifamily Housing": {"2025-2029": 4.1, "2030-2034": 2.4, "2035-2039": 1.8, "2040-2044": 1.1, "2045-2049": 0.6, "2050+": 0}
    "Office": {"2025-2029": 5.3, "2030-2034": 3.2, "2035-2039": 2.4, "2040-2044": 1.6, "2045-2049": 0.8, "2050+": 0}
    "Retail": {"2025-2029": 7.1, "2030-2034": 3.4, "2035-2039": 2.4, "2040-2044": 1.5, "2045-2049": 0.7, "2050+": 0}
    "Services": {"2025-2029": 7.5, "2030-2034": 4.5, "2035-2039": 3.3, "2040-2044": 2.2, "2045-2049": 1.1, "2050+": 0}
    "Storage": {"2025-2029": 5.4, "2030-2034": 2.8, "2035-2039": 1.8, "2040-2044": 1.0, "2045-2049": 0.4, "2050+": 0}
    "Technology/Science": {"2025-2029": 19.2, "2030-2034": 11.1, "2035-2039": 7.8, "2040-2044": 5.1, "2045-2049": 2.5, "2050+": 0}

emission_factors:                  # kgCO2e/MMBtu (fuels, district energy) and kgCO2e/MWh (grid electricity)
  natural_gas: {unit: kgCO2e/MMBtu, source: factor_list, values: {"2023+": 53.11}}
  propane: {unit: kgCO2e/MMBtu, source: factor_list, values: {"2023+": 64.25}}
  fuel_oil_1: {unit: kgCO2e/MMBtu, source: factor_list, values: {"2023+": 73.5}}
  fuel_oil_2: {unit: kgCO2e/MMBtu, source: factor_list, values: {"2023+": 74.21}}
  fuel_oil_4: {unit: kgCO2e/MMBtu, source: factor_list, values: {"2023+": 75.29}}
  fuel_oil_5_6: {unit: kgCO2e/MMBtu, source: factor_list, values: {"2023+": 75.35}}
  diesel: {unit: kgCO2e/MMBtu, source: factor_list, values: {"2023+": 74.21}}
  kerosene: {unit: kgCO2e/MMBtu, source: factor_list, values: {"2023+": 77.69}}
  district_steam:
    unit: kgCO2e/MMBtu
    source: factor_list
    values: {"2023+": 66.40}
    note: >-
      ENERGY STAR default. Operators submit system factors (2024 list: Vicinity Boston 55.2, Longfellow Loop 51.6,
      MATEP 63.7); the 2026 disclosure applies 58.1 to most Vicinity customers, a value no public document gives.
      Pass a system factor as an override when known.
  district_hot_water: {unit: kgCO2e/MMBtu, source: factor_list, values: {"2023+": 66.40}}
  district_chilled_water: {unit: kgCO2e/MMBtu, source: factor_list, values: {"2023+": 52.70}, note: "electric-driven chiller default"}
  electricity:
    unit: kgCO2e/MWh
    source: policies_procedures
    section: "Appendix B, projected grid emissions factors (Regulations §VIII.a.ii(a): the projected factor caps the annual one)"
    values: {"2025": 249, "2026": 242, "2027": 265, "2028": 265, "2029": 264, "2030": 259, "2031": 254, "2032": 249, "2033": 243, "2034": 237, "2035": 231, "2036": 224, "2037": 217, "2038": 211, "2039": 204, "2040": 198, "2041": 192, "2042": 187, "2043": 182, "2044": 177, "2045": 173, "2046": 168, "2047": 163, "2048": 159, "2049": 155, "2050": 150}

electricity:
  rps_exempt_share: {"2024": 0.24, "2025": 0.27, "2026": 0.3, "2027": 0.33, "2028": 0.36, "2029": 0.39, "2030": 0.4, "2031": 0.41, "2032": 0.42, "2033": 0.43, "2034": 0.44, "2035": 0.45, "2036": 0.46, "2037": 0.47, "2038": 0.48, "2039": 0.49, "2040": 0.5, "2041": 0.51, "2042": 0.52, "2043": 0.53, "2044": 0.54, "2045": 0.55, "2046": 0.56, "2047": 0.57, "2048": 0.58, "2049": 0.59, "2050": 0.6}
  subtract_renewable_kwh: true
  source: policies_procedures
  section: "§5.B-C: kWh × (100% − RPS Class I [− BCCE RECs]) × grid factor"
  note: >-
    RPS shares from M.G.L. c.25A §11F (mgl_rps) anchored at 24% in 2024 (re_guidance). Renewable kWh reported to
    the city come off after the RPS share: max(0, kWh × (1 − RPS) − renewable kWh) reproduces 100% of the
    2026 disclosure's electricity emissions.

blending:
  method: largest_primary_use
  optional_method: primary_use_blend
  primary_use_min_share: 0.10
  source: policies_procedures
  section: "Ordinance §7-2.2(i)(i); P&P §6.A-B (non-primary sq ft is added to the largest primary use); default per flexibility_guide"

penalty:
  kind: per_unit_over_limit
  unit: tCO2e
  rate: 234
  source: ordinance
  section: "§7-2.2 compliance mechanisms (d): Alternative Compliance Payment, initially $234 per metric ton CO2e"
  note: >-
    BERDO has no per-ton fine: the ACP is what covering excess emissions costs, and open-bps reports it as the
    exposure. A building that neither complies nor pays faces fines of $1,000 a day (35,000+ sq ft or 35+ units)
    or $300 a day (20,000-35,000 sq ft or 15-34 units), §7-2.2 enforcement (ii).

unassignable_types:
  "Other": "not listed in P&P Appendix A; the Environment Department assigns a Building Use"
  "Electric Vehicle Charging Station": "not listed in P&P Appendix A"
  "Mixed Use Property": "not listed in P&P Appendix A"

notes:
  - "Buildings of 20,000-35,000 sq ft (or 15-34 units) are subject to emissions standards from 2030 (§7-2.2(i))."
  - "Fuel factors are the city's 2023+ list; the Environment Department may update them each April 15 (Regulations §VIII.a)."
  - "Grid factors are the projected factors in P&P Appendix B, which cap the annual factor; the annual factor can be lower."
  - "Not modelled: Individual Compliance Schedules, Hardship Compliance Plans, Building Portfolios, campus district energy, EV and backup-generation exemptions."

